[package]
name = "argus-daemon"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "ARGUS privileged daemon (argusd)"

[[bin]]
name = "argusd"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
semver = { workspace = true }
argus-domain = { workspace = true }
argus-ai-core = { workspace = true }
argus-cloud = { workspace = true }
toml = { workspace = true }
argus-ipc = { workspace = true }
argus-observability = { workspace = true }
argus-state = { workspace = true }
argus-policy = { workspace = true }
argus-reporting = { workspace = true }
argus-runbooks = { workspace = true }
argus-kubernetes = { workspace = true, optional = true }
argus-memory = { workspace = true }
argus-executor = { workspace = true }
argus-events = { workspace = true }
argus-validate = { workspace = true }
async-trait = { workspace = true }
argus-sensors = { workspace = true }
argus-observe = { workspace = true }
argus-anomaly = { workspace = true }
argus-systemd = { workspace = true }
argus-container = { workspace = true }
argus-risk = { workspace = true }

[dev-dependencies]
argus-correlate = { workspace = true }
argus-incidents = { workspace = true }
argus-investigate = { workspace = true }
tempfile = "3"

[features]
# The live Kubernetes backend (kube-rs + the cluster bridge). Off by default
# so the single-host build stays lean (ADR-0037); enable on hosts that run a
# cluster and configure [kubernetes] in argus.toml.
kubernetes = ["dep:argus-kubernetes", "argus-kubernetes/kube"]

[lints]
workspace = true

[package.metadata.deb]
name = "argusd"
maintainer = "ARGUS AI <maintainers@argus.0x-ai.com>"
section = "utils"
priority = "optional"
extended-description = "ARGUS autonomous infrastructure operations runtime daemon"

[package.metadata.deb.systemd-units]
unit-scripts = "../../deploy/debian"
unit-name = "argusd"
enable = true
