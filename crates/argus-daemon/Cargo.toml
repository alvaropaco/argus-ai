[package]
name = "argus-daemon"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "ARGUS privileged daemon (argusd)"

[[bin]]
name = "argusd"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
semver = { workspace = true }
argus-domain = { workspace = true }
argus-ai-core = { workspace = true }
argus-ipc = { workspace = true }
argus-observability = { workspace = true }
argus-state = { workspace = true }
argus-policy = { workspace = true }
argus-executor = { workspace = true }
argus-events = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "argusd"
maintainer = "ARGUS AI <maintainers@argus.0x-ai.com>"
section = "utils"
priority = "optional"
extended-description = "ARGUS autonomous infrastructure operations runtime daemon"

[package.metadata.deb.systemd-units]
unit-scripts = "../../deploy/debian"
unit-name = "argusd"
enable = true
