[package]
name = "argus-mcp"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "ARGUS MCP client runtime: external MCP servers' tools as typed capabilities (spec 014, ADR-0044)"

[dependencies]
argus-domain = { workspace = true }
argus-executor = { workspace = true }
# The HTTP client behind rmcp's streamable-HTTP transport; pinned to the same
# major so rmcp's `StreamableHttpClient for reqwest::Client` impl applies.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
] }
rmcp = { version = "3.5", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = [
    "server",
    "transport-async-rw",
] }
tokio = { workspace = true, features = ["process", "io-std", "test-util"] }

[lints]
workspace = true

# The subprocess integration test is harness-free so the child's stdio
# carries nothing but the MCP protocol.
[[test]]
name = "stdio_subprocess"
harness = false
