[package]
name = "argus-ai-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "ARGUS command-line interface"

[[bin]]
name = "argus"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
crossterm = "0.29.0"
argus-ipc = { workspace = true }
argus-ai-tui = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
name = "argus"
maintainer = "ARGUS AI <maintainers@argus.0x-ai.com>"
section = "utils"
priority = "optional"
extended-description = "ARGUS autonomous infrastructure operations CLI"
