[package]
name = "argus-observability"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "ARGUS tracing and OpenTelemetry instrumentation"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = { version = "0.33.0", features = ["tracing-log"] }

[lints]
workspace = true
