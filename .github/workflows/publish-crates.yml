name: Publish Crates

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run cargo publish in dry-run mode'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: crates-verify

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --locked

  publish:
    name: Publish crates.io packages
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry_run == false
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: crates-publish

      - name: Check package metadata
        run: cargo metadata --format-version 1 --no-deps

      - name: Publish workspace crates
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured."
            exit 1
          fi

          cargo metadata --format-version 1 --no-deps > /tmp/argus-packages.json
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(python3 <<'PYEOF'
          import json
          m = json.load(open("/tmp/argus-packages.json"))
          pkgs = {p["name"]: p for p in m["packages"]}
          def deps(p):
              return sorted(d["name"] for d in p.get("dependencies", []) if d.get("path"))
          order = []
          seen = set()
          def visit(n):
              if n in seen:
                  return
              seen.add(n)
              for d in deps(pkgs[n]):
                  visit(d)
              order.append(n)
          for n in sorted(pkgs):
              visit(n)
          print("\n".join(f"{n} {pkgs[n]['version']}" for n in order))
          PYEOF
          )

          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No workspace packages found."
            exit 1
          fi

          for entry in "${packages[@]}"; do
            package="${entry%% *}"
            version="${entry##* }"
            if curl -fsS -A "argus-release" "https://crates.io/api/v1/crates/${package}/${version}" >/dev/null 2>&1; then
              echo "Skipping ${package} ${version} (already published)."
              continue
            fi
            echo "Publishing ${package} ${version}..."
            cargo publish --package "${package}" --locked
            echo "Waiting briefly for crates.io index propagation..."
            sleep 10
          done
