name: Publish Crates

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run cargo publish in dry-run mode'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: crates-verify

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace --all-features

      - name: Build
        run: cargo build --workspace --all-features --locked

      - name: Package validation
        run: cargo package --workspace --locked --allow-dirty

  publish:
    name: Publish crates.io packages
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry_run == false
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: crates-publish

      - name: Check package metadata
        run: cargo metadata --format-version 1 --no-deps

      - name: Publish workspace crates
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured."
            exit 1
          fi

          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(
            cargo metadata --format-version 1 --no-deps \
              | python3 -c 'import json,sys; m=json.load(sys.stdin); print("\\n".join(p["name"] for p in m["packages"]))'
          )

          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No workspace packages found."
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Publishing ${package}..."
            cargo publish --package "${package}" --locked
            echo "Waiting briefly for crates.io index propagation..."
            sleep 10
          done
