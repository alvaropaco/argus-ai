name: Publish APT Repository

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (for example v0.1.0)'
        required: true
        type: string

concurrency:
  group: apt-release
  cancel-in-progress: false

jobs:
  package:
    name: Build Debian package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            linker: ''
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install AArch64 cross compiler
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure target linker
        if: matrix.arch == 'arm64'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: apt-${{ matrix.arch }}

      - name: Verify source
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Install cargo-deb
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2
        with:
          tool: cargo-deb

      - name: Build release binaries
        env:
          CARGO_TERM_COLOR: always
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build Debian package
        shell: bash
        env:
          DEB_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The Debian package version is derived from the release tag so that
          # a new release can never reuse an existing APT package version.
          cargo deb --package argus-ai-cli --target ${{ matrix.target }} --no-build --deb-version "$DEB_VERSION"
          cargo deb --package argus-daemon --target ${{ matrix.target }} --no-build --deb-version "$DEB_VERSION"
          mkdir -p dist
          find target/${{ matrix.target }}/debian -maxdepth 1 -name '*.deb' -type f -exec cp {} dist/ \;

          expected_cli="argus_${DEB_VERSION}_${{ matrix.arch }}.deb"
          expected_daemon="argusd_${DEB_VERSION}_${{ matrix.arch }}.deb"
          test -f "dist/$expected_cli"
          test -f "dist/$expected_daemon"
          echo "Built Debian packages:"
          ls -lh dist/*.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  publish:
    name: Publish APT repository
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: apt-pages
        continue-on-error: true

      - name: Initialize gh-pages directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apt-pages
          touch apt-pages/.nojekyll
          mkdir -p apt-pages/pool/main/a/argus

      - name: Download Debian packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: apt-pages/pool/main/a/argus

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APT_GPG_PRIVATE_KEY:-}" ]]; then
            echo "APT_GPG_PRIVATE_KEY not set; repository will be unsigned."
          else
            mkdir -p .gnupg
            chmod 700 .gnupg
            export GNUPGHOME="$PWD/.gnupg"
            printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          fi

      - name: Prepare reprepro configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apt-pages/conf
          cp deploy/apt/conf/distributions apt-pages/conf/distributions
          if [[ -n "${APT_GPG_KEY_ID:-}" ]]; then
            echo "SignWith: ${APT_GPG_KEY_ID}" >> apt-pages/conf/distributions
          fi
        env:
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}

      - name: Import packages into repository
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$PWD/.gnupg"
          cd apt-pages
          reprepro includedeb stable pool/main/a/argus/*.deb

      - name: Export public key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${APT_GPG_PRIVATE_KEY:-}" ]]; then
            export GNUPGHOME="$PWD/.gnupg"
            gpg --armor --export > apt-pages/argus-archive-keyring.asc
            gpg --export > apt-pages/argus-archive-keyring.gpg
          fi

      - name: Generate repository checksums
        shell: bash
        run: |
          set -euo pipefail
          cd apt-pages
          find dists pool -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Publish gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd apt-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "apt: publish ${{ steps.meta.outputs.tag }}" || exit 0
          git push origin HEAD:gh-pages
