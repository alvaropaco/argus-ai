[workspace]
resolver = "2"
members = [
    "crates/argus-domain",
    "crates/argus-ai-core",
    "crates/argus-ai-cli",
    "crates/argus-ai-tui",
    "crates/argus-daemon",
    "crates/argus-ipc",
    "crates/argus-policy",
    "crates/argus-executor",
    "crates/argus-events",
    "crates/argus-state",
    "crates/argus-observability",
    "crates/argus-install",
    "crates/argus-cloud",
    "crates/argus-validate",
    "crates/argus-sensors",
    "crates/argus-observe",
    "crates/argus-anomaly",
    "crates/argus-systemd",
    "crates/argus-container",
    "crates/argus-correlate",
    "crates/argus-risk",
    "crates/argus-incidents",
    "crates/argus-investigate",
    "crates/argus-kubernetes",
    "crates/argus-memory",
    "crates/argus-runbooks",
    "crates/argus-reporting",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/alvaropaco/argus-ai"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
base64 = "0.23.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
futures-util = "0.3.34"
argus-domain = { version = "0.2.0", path = "crates/argus-domain" }
argus-ai-core = { version = "0.2.0", path = "crates/argus-ai-core" }
argus-ipc = { version = "0.2.0", path = "crates/argus-ipc" }
argus-observability = { version = "0.2.0", path = "crates/argus-observability" }
argus-policy = { version = "0.2.0", path = "crates/argus-policy" }
argus-executor = { version = "0.2.0", path = "crates/argus-executor" }
argus-state = { version = "0.2.0", path = "crates/argus-state" }
argus-events = { version = "0.2.0", path = "crates/argus-events" }
argus-ai-tui = { version = "0.2.0", path = "crates/argus-ai-tui" }
argus-install = { version = "0.2.0", path = "crates/argus-install" }
argus-cloud = { version = "0.2.0", path = "crates/argus-cloud" }
argus-validate = { version = "0.2.0", path = "crates/argus-validate" }
argus-sensors = { version = "0.2.0", path = "crates/argus-sensors" }
argus-observe = { version = "0.2.0", path = "crates/argus-observe" }
argus-anomaly = { version = "0.2.0", path = "crates/argus-anomaly" }
argus-systemd = { version = "0.2.0", path = "crates/argus-systemd" }
argus-container = { version = "0.2.0", path = "crates/argus-container" }
argus-correlate = { version = "0.2.0", path = "crates/argus-correlate" }
argus-risk = { version = "0.2.0", path = "crates/argus-risk" }
argus-incidents = { version = "0.2.0", path = "crates/argus-incidents" }
argus-investigate = { version = "0.2.0", path = "crates/argus-investigate" }
argus-kubernetes = { version = "0.2.0", path = "crates/argus-kubernetes" }
argus-memory = { version = "0.2.0", path = "crates/argus-memory" }
argus-runbooks = { version = "0.2.0", path = "crates/argus-runbooks" }
argus-reporting = { version = "0.2.0", path = "crates/argus-reporting" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
