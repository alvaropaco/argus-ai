[workspace]
resolver = "2"
members = [
    "crates/argus-domain",
    "crates/argus-ai-core",
    "crates/argus-ai-cli",
    "crates/argus-ai-tui",
    "crates/argus-daemon",
    "crates/argus-ipc",
    "crates/argus-policy",
    "crates/argus-executor",
    "crates/argus-events",
    "crates/argus-state",
    "crates/argus-observability",
    "crates/argus-install",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/alvaropaco/argus-ai"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
argus-domain = { version = "0.1.5", path = "crates/argus-domain" }
argus-ai-core = { version = "0.1.5", path = "crates/argus-ai-core" }
argus-ipc = { version = "0.1.5", path = "crates/argus-ipc" }
argus-observability = { version = "0.1.5", path = "crates/argus-observability" }
argus-policy = { version = "0.1.5", path = "crates/argus-policy" }
argus-executor = { version = "0.1.5", path = "crates/argus-executor" }
argus-state = { version = "0.1.5", path = "crates/argus-state" }
argus-events = { version = "0.1.5", path = "crates/argus-events" }
argus-ai-tui = { version = "0.1.5", path = "crates/argus-ai-tui" }
argus-install = { version = "0.1.5", path = "crates/argus-install" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
